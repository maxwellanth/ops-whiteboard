<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ops Whiteboard logo: a little classroom whiteboard with a marker-drawn project web -->
  <defs>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5f6"/><stop offset=".45" stop-color="#b9c0c7"/><stop offset=".6" stop-color="#eef0f2"/><stop offset="1" stop-color="#8d949b"/></linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d949b"/><stop offset=".5" stop-color="#dfe3e7"/><stop offset="1" stop-color="#9aa1a8"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="#1f3a5f"/>
  <!-- frame and board -->
  <rect x="58" y="78" width="396" height="300" rx="14" fill="url(#alu)"/>
  <rect x="72" y="92" width="368" height="272" rx="4" fill="#ffffff"/>
  <rect x="50" y="72" width="22" height="22" rx="5" fill="#2b2f33"/><rect x="440" y="72" width="22" height="22" rx="5" fill="#2b2f33"/>
  <!-- marker web -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222 226c6-22 62-24 72-2 9 22-24 34-42 32-24-2-38-12-30-30z" stroke="#1e1e1e" stroke-width="9"/>
    <path d="M226 214 L170 170" stroke="#237a3b" stroke-width="10"/>
    <path d="M292 212 L346 168" stroke="#1c4fa1" stroke-width="7"/>
    <path d="M290 248 L344 290" stroke="#c92a2a" stroke-width="7"/>
    <path d="M222 246 L170 292" stroke="#1e1e1e" stroke-width="6" stroke-dasharray="4 14"/>
  </g>
  <!-- notes: paid ($), next, blocker -->
  <g transform="rotate(-5 140 150)"><rect x="104" y="120" width="76" height="62" rx="4" fill="#d3f9d8" stroke="#237a3b" stroke-width="6"/>
    <text x="142" y="166" font-family="Comic Sans MS, Chalkboard, cursive" font-weight="700" font-size="44" fill="#237a3b" text-anchor="middle">$</text></g>
  <g transform="rotate(4 372 150)"><rect x="338" y="122" width="70" height="58" rx="3" fill="#fff3a6" stroke="#e8c84a" stroke-width="3"/>
    <path d="M352 142h40M352 158h28" stroke="#1e1e1e" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="rotate(-4 372 306)"><rect x="338" y="280" width="70" height="56" rx="3" fill="#ffc9c9" stroke="#f08080" stroke-width="3"/>
    <path d="M358 296l28 26M386 296l-28 26" stroke="#c92a2a" stroke-width="6" stroke-linecap="round"/></g>
  <g transform="rotate(5 140 306)"><circle cx="140" cy="300" r="12" fill="none" stroke="#c92a2a" stroke-width="5"/><path d="M140 312v18M126 320h28M140 330l-10 14M140 330l10 14" stroke="#c92a2a" stroke-width="5" stroke-linecap="round"/>
    <text x="164" y="306" font-family="Comic Sans MS, Chalkboard, cursive" font-weight="700" font-size="30" fill="#c92a2a">?</text></g>
  <!-- marker tray with markers -->
  <rect x="88" y="378" width="336" height="22" rx="8" fill="url(#tray)"/>
  <g><rect x="120" y="370" width="92" height="16" rx="6" fill="#f5f5f5" stroke="#9aa1a8" stroke-width="2"/><rect x="200" y="369" width="26" height="18" rx="6" fill="#1c4fa1"/></g>
  <g><rect x="270" y="370" width="92" height="16" rx="6" fill="#f5f5f5" stroke="#9aa1a8" stroke-width="2"/><rect x="350" y="369" width="26" height="18" rx="6" fill="#c92a2a"/></g>
  <text x="256" y="462" font-family="Comic Sans MS, Chalkboard, cursive" font-weight="700" font-size="46" fill="#ffffff" text-anchor="middle">OPS</text>
</svg>
